<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta http-equiv="refresh" content="0;url=../cuenta.html?tipo=comprador">
<script>location.href = '../cuenta.html?tipo=comprador';</script>
<style>body{display:flex;flex-direction:column;min-height:100vh}footer{margin-top:auto}</style><style id="nx-header">
header.top{justify-content:space-between}
header.top .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Archivo',sans-serif;font-weight:900;font-size:27px;letter-spacing:5px;background:linear-gradient(115deg,#f2f8ff 0%,#9db9da 30%,#e9f3fe 52%,#557da6 78%,#c3d9ef 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(110,160,220,.35));white-space:nowrap;text-decoration:none}
header.top .logo em,header.top .logo span{background:none!important;color:transparent!important;-webkit-text-fill-color:transparent;font-style:normal}
.nx-back{background:none;border:0;color:#fff;font-size:25px;line-height:1;cursor:pointer;padding:8px 10px;font-family:inherit;position:relative;z-index:5}
#menu-btn,#menubtn{background:none!important;border:0!important;color:#fff!important;font-size:23px;padding:8px 10px;cursor:pointer}
header.top .menu,header.top .ddnav{display:block!important;background:linear-gradient(165deg,#17334f,#0c1e33)!important;border:1px solid #2b4d74!important;border-radius:18px;min-width:248px;box-shadow:0 22px 50px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-10px) scale(.98);transform-origin:top right;transition:opacity .22s ease,transform .22s ease,visibility .22s;overflow:hidden}
header.top .menu.open,header.top .ddnav.open{opacity:1;visibility:visible;transform:none}
header.top .menu a,header.top .ddnav a{display:block;padding:15px 22px;color:#eaf3ff!important;font-size:15.5px;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08)}
header.top .menu a:last-child,header.top .ddnav a:last-child{border-bottom:0}
header.top .menu a:hover,header.top .ddnav a:hover{background:rgba(120,170,230,.13)}
</style>
</head>
<body><script>function nxBack(){try{if(window.history.length>1){history.back();return;}}catch(e){}var a=document.querySelector('header.top .logo');window.location.href=a?a.getAttribute('href'):'index.html';}</script>
</body>
</html>
