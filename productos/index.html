<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#e8eef7;--card:#ffffff;--line:#c7d6ea;--txt:#111111;--mut:#47617e;--acc:#1f4e79}
body{background:#ffffff;background-attachment:fixed;color:#111111;font-family:'Source Sans 3',Archivo,Arial,sans-serif;min-height:100vh}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#142c47;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;flex:0 0 auto;color:#111111!important}
.logo em{font-style:normal;color:var(--acc)}
.search{flex:1;display:flex;background:var(--card);border:2px solid #b7cadd;border-radius:14px;padding:10px 16px;gap:8px;align-items:center}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#111111!important;font-size:15px;font-family:inherit}
.search input::placeholder{color:#9aa0a8!important}
.back{color:var(--mut);text-decoration:none;font-size:14px;flex:0 0 auto}
main{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.sec{margin-bottom:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-head h2{font-size:20px;font-weight:800}
.sec-head h2 .hl{color:var(--acc)}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.card{flex:0 0 190px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;transition:transform .18s}
.card:hover{transform:translateY(-3px)}
.card .ph{aspect-ratio:1;position:relative;overflow:hidden;background:#132a44}
.card .ph img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;padding:8px;box-sizing:border-box}
.card .cat{position:absolute;top:10px;left:10px;background:rgba(8,9,13,.75);backdrop-filter:blur(6px);font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;color:#ffffff!important}
.card-body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-title{font-size:14px;font-weight:700;line-height:1.35;color:#111111;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-seller{font-size:12px;color:var(--mut)}
.card-seller a{color:var(--mut);text-decoration:none}
.card-price{font-size:19px;font-weight:900;margin-top:auto;padding-top:8px}
.buy{margin-top:8px;display:block;text-align:center;background:var(--acc);color:#ffffff;font-weight:800;font-size:13px;padding:11px;border-radius:12px;text-decoration:none}
.add-cart{margin-top:8px;width:100%;background:none;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.grid .card{flex:none}
.sr-label{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:0 0 12px}
.empty{text-align:center;color:var(--mut);padding:44px 10px;font-size:15px}
.loading{text-align:center;color:var(--mut);padding:44px 10px}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:#111111!important;font-family:inherit}
.chip.on{background:var(--acc);color:#ffffff!important;border-color:var(--acc)}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:26px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.card{flex-basis:215px}}
@media(max-width:600px){
header.top{flex-wrap:wrap;gap:10px}
.logo{font-size:19px}
.search{order:3;flex:1 1 100%;padding:9px 14px;margin-top:4px}
.search input{font-size:16px}
.card{flex-basis:158px}
.sec-head h2{font-size:17px}
.buy{padding:12px;font-size:14px}
.add-cart{padding:11px;font-size:14px}
.row{gap:10px}
.chip{padding:9px 16px;font-size:13px}
}

/* ===== azul metálico ===== */
.hl,.logo em{background:linear-gradient(120deg,#7fb0e0 0%,#3d7ab5 35%,#a9cdf2 55%,#1f4e79 80%,#5f97c4 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.btn:not(.btn-ghost):not(.btn-wa),.buy,.hero-search button{background:linear-gradient(135deg,#3d7ab5 0%,#24567f 30%,#1d4568 50%,#2a5f8f 70%,#122a44 100%)!important;color:#ffffff!important;border:0!important}
.card-price,.pd-price{background:linear-gradient(120deg,#2a5f8f,#1f4e79 40%,#3d7ab5 60%,#122a44)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.card-price{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:#111111!important}

.menu-wrap{position:relative;margin-left:auto}
#menu-btn{background:none;border:1px solid var(--line);color:#f2f4f8;font-size:20px;border-radius:12px;padding:8px 13px;cursor:pointer;font-family:inherit}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:200px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.16);z-index:50}
.menu.open{display:block}
.menu a{display:block;padding:14px 20px;text-decoration:none;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);color:#111111}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:rgba(0,0,0,.05)}
body{display:flex;flex-direction:column;min-height:100vh}footer{margin-top:auto}
#q-btn{background:#1d4568 !important;border-color:#1d4568 !important;color:#fff !important}
</style>

<style>
/* ===== Compartir productos ===== */
#share-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#142c47;color:#fff;font-size:14px;font-weight:700;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:999;font-family:inherit}
#share-toast.show{opacity:1;transform:translate(-50%,0)}
.card{position:relative}
.shareb{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid #e2e2e8;background:rgba(255,255,255,.94);color:#142c47;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(17,17,20,.13);font-family:inherit}
.shareb:active{transform:scale(.93)}
</style>

<style>
.qbtn{border:1.5px solid #c7d6ea;background:linear-gradient(180deg,#24567f,#1d4568);color:#141416;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem;white-space:nowrap}
</style>

<style id="nx-header">
header.top{justify-content:space-between}
header.top .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Caveat Brush',cursive;font-weight:400;font-size:42px;line-height:1;letter-spacing:0;background:none;color:#ffffff!important;-webkit-text-fill-color:#ffffff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));white-space:nowrap;text-decoration:none}
header.top .logo em,header.top .logo span{background:none!important;color:transparent!important;-webkit-text-fill-color:transparent;font-style:normal}
.nx-back{background:none;border:0;color:#fff;font-size:25px;line-height:1;cursor:pointer;padding:8px 10px;font-family:inherit;position:relative;z-index:5}
#menu-btn,#menubtn{background:none!important;border:0!important;color:#fff!important;font-size:23px;padding:8px 10px;cursor:pointer}
header.top{z-index:300}
header.top .menu,header.top .ddnav{position:fixed!important;left:0!important;right:0!important;top:56px!important;width:auto!important;min-width:0!important;height:50vh;display:flex!important;flex-direction:column;justify-content:space-evenly;padding:8px 6px;background:linear-gradient(180deg,#17334f,#0c1e33)!important;border:0!important;border-bottom:1px solid #2b4d74!important;border-radius:0 0 22px 22px!important;box-shadow:0 30px 60px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-16px);transition:opacity .25s ease,transform .25s ease,visibility .25s;overflow:hidden;z-index:290}
html.nx-is-admin header.top .menu,html.nx-is-admin header.top .ddnav,body.is-admin header.top .menu,body.is-admin header.top .ddnav{height:auto;max-height:calc(100dvh - 56px);justify-content:flex-start;overflow-y:auto}
header.top .menu.open,header.top .ddnav.open{opacity:1;visibility:visible;transform:none}
header.top .menu a,header.top .ddnav a{display:block;padding:16px 22px;color:#eaf3ff!important;font-size:18px;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08)}
header.top .menu a:last-child,header.top .ddnav a:last-child{border-bottom:0}
header.top .menu a:hover,header.top .ddnav a:hover{background:rgba(120,170,230,.13)}
#btn-buy,.add-cart,button[data-add],.buy{background:linear-gradient(160deg,#1d4568,#122a44)!important;color:#ffffff!important;border:0!important}
#btn-cart{border:1.5px solid #1d4568!important;color:#1d4568!important;background:transparent!important}
</style>
<style id="nx-search-fix">
header.top{display:grid!important;grid-template-columns:44px 1fr auto 48px;column-gap:8px}
header.top .nx-back{grid-column:1;grid-row:1}

header.top .logo{top:29px}
</style>

<body>
<header class="top">
 <button class="nx-back" aria-label="Volver" onclick="nxBack()">&#8592;</button>
  <a class="logo" href="../index.html">Nexo</a>
  <label class="search"><input id="q" type="search" placeholder="Buscar productos o empresas…"></label>
  <button class="qbtn" id="q-btn" type="button" aria-label="Buscar" title="Buscar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
  <div class="menu-wrap">
    <button id="menu-btn" aria-label="Menú">☰</button>
    <nav class="menu" id="menu">
      <a href="../index.html">Inicio</a>
      <a href="../cuenta.html" onclick="return goMiCuenta()">Mi cuenta</a>
      <a href="../comprador/perfil.html?ver=carrito">Carrito</a>
          <a href="#" id="menu-logout" style="display:none;color:#ff201f" onclick="return doLogout()">Cerrar sesión</a>
</nav>
  </div>
</header>

<main id="main"><div class="loading">Cargando catálogo…</div></main>
<footer>© 2026 Nexo · Compra y vende seguro</footer>
<script>
var SUPABASE_URL = "https://ywtmzkzcxnntvxvjcger.supabase.co";
var SUPABASE_ANON = "sb_publishable_hm3dr-gmYE1loU-yXiZkow_uompYxYl";
/* sesión persistente: renueva el token automáticamente */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('nexo_session') || 'null');
    if(!s || !s.access_token || !s.refresh_token) return;
    var exp = 0;
    if(s.expires_at) exp = s.expires_at * 1000;
    else { try{ exp = JSON.parse(atob(s.access_token.split('.')[1])).exp * 1000; }catch(e){} }
    if(!exp || Date.now() < exp - 120000) return;
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function(r){ return r.json(); }).then(function(ns){
      if(ns && ns.access_token){ localStorage.setItem('nexo_session', JSON.stringify(ns)); location.reload(); }
      else localStorage.removeItem('nexo_session');
    }).catch(function(){});
  }catch(e){}
})();

var PRODUCTS = [], SELLERS = {}, activeCat = 'Todo';
function api(path){
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  }).then(function(r){ if(!r.ok) throw new Error('API ' + r.status); return r.json(); });
}
function money(n){ return '$' + Number(n).toFixed(2); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function buyerSession(){ try { var s = JSON.parse(localStorage.getItem('nexo_session')); return (s && s.access_token) ? s : null; } catch(e){ return null; } }

function cardHTML(p){
  var s = p.sellers || {};
  var img = p.imagen_url || '';
  return '<div class="card"><a href="../producto/?id=' + p.id + '" style="text-decoration:none;color:inherit;display:block"><div class="ph">' + (img ? '<img src="' + esc(img) + '" alt="' + esc(p.titulo) + '" loading="lazy">' : '')
    + '<span class="cat">' + esc(p.categoria || 'General') + '</span></div>'
    + '<div class="card-body"><div class="card-title">' + esc(p.titulo) + '</div></a>'
    + '<div class="card-seller">por <a href="../vendedor/?s=' + esc(s.slug || '') + '">' + esc(s.nombre || '') + '</a></div>'
    + '<div class="card-price">' + money(p.precio) + '</div>'
    + '<a class="buy" href="../producto/?id=' + p.id + '">Ver</a></div></div>';
}
function cats(){
  var s = {};
  PRODUCTS.forEach(function(p){ s[p.categoria || 'General'] = 1; });
  return ['Todo'].concat(Object.keys(s).sort());
}
var qTerm = '';
function filtered(){
  var term = qTerm.trim().toLowerCase();
  return PRODUCTS.filter(function(p){
    var okC = activeCat === 'Todo' || (p.categoria || 'General') === activeCat;
    var okQ = !term || (p.titulo + ' ' + (p.descripcion || '') + ' ' + (p.categoria || '') + ' ' + (p.sellers ? p.sellers.nombre : '')).toLowerCase().indexOf(term) >= 0;
    return okC && okQ;
  });
}
function render(){
  var main = document.getElementById('main');
  var term = qTerm.trim();
  var list = filtered();
  var html = '<div class="chips">' + cats().map(function(c){
    return '<button class="chip' + (c === activeCat ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>';
  }).join('') + '</div>';

  if(term || activeCat !== 'Todo'){
    // Buscar empresas que coincidan
    var sellList = [];
    if(term){
      var tl = term.toLowerCase();
      Object.keys(SELLERS).forEach(function(slug){
        var s = SELLERS[slug];
        if(s.nombre && s.nombre.toLowerCase().indexOf(tl) >= 0) sellList.push(s);
      });
    }
    html += '<div class="sec"><div class="sec-head"><h2>Resultados <span class="hl">(' + list.length + ')</span></h2></div>'
      + (list.length ? '<div class="grid">' + list.map(cardHTML).join('') + '</div>' : '<p class="empty">Sin productos. Prueba con otra búsqueda.</p>') + '</div>';
    if(sellList.length){
      html += '<div class="sec"><div class="sec-head"><h2>Empresas <span class="hl">(' + sellList.length + ')</span></h2></div>'
        + '<div class="grid">' + sellList.map(function(s){
            return '<a href="../vendedor/?s=' + esc(s.slug) + '" style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #c7d6ea;border-radius:14px;padding:14px;text-decoration:none">'
              + '<div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#2e5f8a,#5f89b5);display:grid;place-content:center;color:#fff;font-size:20px;font-weight:800;flex:0 0 auto">' + esc(s.nombre.charAt(0).toUpperCase()) + '</div>'
              + '<div style="color:#111111;font-weight:700;font-size:15px">' + esc(s.nombre) + '</div></a>';
          }).join('') + '</div></div>';
    }
  } else {
    var latest = PRODUCTS.slice(0, 8);
    if(latest.length){
      html += '<div class="sec"><div class="sec-head"><h2>Recomendados <span class="hl">para ti</span></h2></div>'
        + '<div class="row">' + latest.map(cardHTML).join('') + '</div></div>';
    }
    cats().slice(1).forEach(function(c){
      var items = PRODUCTS.filter(function(p){ return (p.categoria || 'General') === c; });
      if(!items.length) return;
      html += '<div class="sec"><div class="sec-head"><h2>' + esc(c) + '</h2></div>'
        + '<div class="row">' + items.map(cardHTML).join('') + '</div></div>';
    });
    if(!PRODUCTS.length) html += '<p class="empty">Aún no hay productos publicados.</p>';
  }
  main.innerHTML = html;
  main.querySelectorAll('.chip').forEach(function(b){
    b.onclick = function(){ activeCat = b.dataset.c; render(); };
  });
}
function addToCart(pid, btn){
  var s = buyerSession();
  if(!s){ location.href = '../cuenta.html?tipo=comprador'; return; }
  btn.disabled = true; btn.textContent = 'Agregando…';
  fetch(SUPABASE_URL + '/rest/v1/cart_items', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify({ user_id: s.user.id, product_id: pid, qty: 1 })
  }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if(res.ok && res.j.length && res.j[0].qty > 1){
        var row = res.j[0];
        fetch(SUPABASE_URL + '/rest/v1/cart_items?id=eq.' + row.id, {
          method: 'PATCH', headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ qty: row.qty + 1 })
        });
      }
      btn.textContent = '✓ En el carrito';
      setTimeout(function(){ btn.disabled = false; btn.textContent = '+ Carrito'; }, 1500);
    }).catch(function(){ btn.disabled = false; btn.textContent = '+ Carrito'; });
}
function applySearch(){ qTerm = document.getElementById('q').value || ''; render(); }
document.getElementById('q-btn').addEventListener('click', applySearch);
document.getElementById('q').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); applySearch(); } });
(function(){
  try{
    var q = new URLSearchParams(location.search).get('q');
    if(q){ document.getElementById('q').value = q; render(); }
  }catch(e){}
})();
document.addEventListener('click', function(e){
  var b = e.target.closest('.add-cart');
  if(b) addToCart(b.dataset.pid, b);
});
api('products?select=*,sellers!inner(slug,nombre)&activo=eq.true&order=created_at.desc')
  .then(function(rows){
    PRODUCTS = rows || [];
    // Extraer vendedores únicos
    (rows || []).forEach(function(p){
      if(p.sellers && p.sellers.slug && !SELLERS[p.sellers.slug]){
        SELLERS[p.sellers.slug] = p.sellers;
      }
    });
    render();
  })
  .catch(function(){ document.getElementById('main').innerHTML = '<p class="empty">No se pudo cargar. Revisa tu conexión.</p>'; });

document.getElementById('menu-btn').onclick = function(e){ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); };
document.addEventListener('click', function(){ var m = document.getElementById('menu'); if(m) m.classList.remove('open'); });
function routeMiCuenta(tipo, slug){
  if(tipo === 'vendedor' && slug){ location.href = '../vendedor/index.html?s=' + encodeURIComponent(slug) + '&edit=1'; }
  else if(tipo === 'vendedor'){ location.href = '../vendedor/cuenta.html'; }
  else { location.href = '../comprador/perfil.html'; }
}
function goMiCuenta(){
  try{
    var s = JSON.parse(localStorage.getItem('nexo_session') || 'null');
    if(!(s && s.access_token)) return true;

    var uid = (s.user && s.user.id) || null;
    if(!uid) return true;
    var H = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token };
    fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid + '&select=tipo,es_admin', { headers: H })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(rows && rows[0] && rows[0].es_admin){ try{ localStorage.removeItem('nexo_tipo'); localStorage.removeItem('nexo_slug'); }catch(e){} location.href = '../admin.html'; return; }
      var t = (rows && rows[0] && rows[0].tipo) || 'comprador';
      try{ localStorage.setItem('nexo_tipo', t); }catch(e){}
      if(t === 'vendedor'){
        fetch(SUPABASE_URL + '/rest/v1/sellers?user_id=eq.' + uid + '&select=slug', { headers: H })
        .then(function(r){ return r.json(); })
        .then(function(r2){
          var sl = (r2 && r2[0] && r2[0].slug) || null;
          if(sl){ try{ localStorage.setItem('nexo_slug', sl); }catch(e){} }
          routeMiCuenta(t, sl);
        }).catch(function(){ routeMiCuenta(t, null); });
      } else {
        routeMiCuenta(t, null);
      }
    }).catch(function(){ location.href = '../cuenta.html'; });
    return false;
  }catch(e){ return true; }
}
function doLogout(){
  try{
    localStorage.removeItem('nexo_session');
    localStorage.removeItem('nexo_tipo');
    localStorage.removeItem('nexo_slug');
  }catch(e){}
  location.href = '../index.html';
  return false;
}
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('nexo_session') || 'null');
    if(s && s.access_token){
      var b = document.getElementById('menu-logout');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
})();
</script>

<script>
function shareToast(msg){
  var t = document.getElementById('share-toast');
  if(!t){ t = document.createElement('div'); t.id = 'share-toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
function shareProd(id, titulo, precio){
  var url = new URL('../producto/?id=' + id, location.href).href;
  var data = { title: 'Nexo', text: (titulo || 'Producto') + (precio != null && precio !== '' ? ' — $' + Number(precio).toFixed(2) : '') + ' en Nexo', url: url };
  if(navigator.share){ navigator.share(data).catch(function(){}); }
  else if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ shareToast('Enlace copiado \u2713'); }, function(){ window.prompt('Copia el enlace:', url); }); }
  else { window.prompt('Copia el enlace:', url); }
}
document.addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('.shareb') : null;
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  shareProd(b.getAttribute('data-share'), b.getAttribute('data-titulo'), b.getAttribute('data-precio'));
});
</script>
