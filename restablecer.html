<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña — Nexo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--card:#ffffff;--line:#c7d6ea;--mut:#47617e;--acc:#1f4e79;--err:#ff5d5d}
body{background:#ffffff;color:#111111;font-family:'Source Sans 3',Archivo,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#142c47;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;color:#111111}
.logo em{font-style:normal;background:linear-gradient(120deg,#7fb0e0 0%,#3d7ab5 35%,#a9cdf2 55%,#1f4e79 80%,#5f97c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px}
.box{width:100%;max-width:480px}
.box h1{font-size:26px;font-weight:900;margin-bottom:6px;text-align:center;color:#1f4e79}
.box>p{color:var(--mut);font-size:14px;margin-bottom:22px;text-align:center}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;margin-top:18px}
label{display:block;font-size:13px;font-weight:700;color:#111111;margin:16px 0 7px;letter-spacing:.3px}
input{width:100%;background:#ffffff;border:1.5px solid #b7cadd;border-radius:14px;color:#111111;font-family:inherit;font-size:15px;padding:14px 16px;outline:none}
input:focus{border-color:#1f4e79;box-shadow:0 0 0 3px rgba(74,74,82,.12)}
.passwrap{position:relative}
.passwrap input{padding-right:74px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#1f4e79;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;padding:6px 8px}
.btn{display:block;width:100%;margin-top:20px;background:linear-gradient(135deg,#3d7ab5 0%,#24567f 30%,#1d4568 50%,#2a5f8f 70%,#122a44 100%);color:#ffffff;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;padding:14px;cursor:pointer;text-align:center;text-decoration:none}
.err{display:none;background:rgba(255,93,93,.12);border:1px solid var(--err);color:#b3261e;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:16px}
.okmsg{display:none;background:rgba(150,185,225,.12);border:1px solid var(--acc);color:#1c7c43;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:16px}
.hidden{display:none!important}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:22px;margin-top:auto}
</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
<style id="nx-header">
header.top{justify-content:space-between}
header.top .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Caveat Brush',cursive;font-weight:400;font-size:42px;line-height:1;letter-spacing:0;background:none;color:#ffffff!important;-webkit-text-fill-color:#ffffff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));white-space:nowrap;text-decoration:none}
header.top .logo em,header.top .logo span{background:none!important;color:transparent!important;-webkit-text-fill-color:transparent;font-style:normal}
.nx-back{background:none;border:0;color:#fff;font-size:25px;line-height:1;cursor:pointer;padding:8px 10px;font-family:inherit;position:relative;z-index:5}
#menu-btn,#menubtn{background:none!important;border:0!important;color:#fff!important;font-size:23px;padding:8px 10px;cursor:pointer}
header.top{z-index:300}
header.top .menu,header.top .ddnav{position:fixed!important;left:0!important;right:0!important;top:56px!important;width:auto!important;min-width:0!important;height:50vh;display:flex!important;flex-direction:column;justify-content:space-evenly;padding:8px 6px;background:linear-gradient(180deg,#17334f,#0c1e33)!important;border:0!important;border-bottom:1px solid #2b4d74!important;border-radius:0 0 22px 22px!important;box-shadow:0 30px 60px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-16px);transition:opacity .25s ease,transform .25s ease,visibility .25s;overflow:hidden;z-index:290}
header.top .menu.open,header.top .ddnav.open{opacity:1;visibility:visible;transform:none}
header.top .menu a,header.top .ddnav a{display:block;padding:16px 22px;color:#eaf3ff!important;font-size:18px;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08)}
header.top .menu a:last-child,header.top .ddnav a:last-child{border-bottom:0}
header.top .menu a:hover,header.top .ddnav a:hover{background:rgba(120,170,230,.13)}
#btn-buy,.add-cart,button[data-add],.buy{background:linear-gradient(160deg,#1d4568,#122a44)!important;color:#ffffff!important;border:0!important}
#btn-cart{border:1.5px solid #1d4568!important;color:#1d4568!important;background:transparent!important}
</style>
</head>
<body>
<header class="top">
 <button class="nx-back" aria-label="Volver" onclick="nxBack()">&#8592;</button>
  <a class="logo" href="index.html">Nexo</a>
</header>
<main>
  <div class="box">
    <h1>Restablecer contraseña</h1>
    <p>Crea una contraseña nueva para tu cuenta de Nexo.</p>
    <div class="form-card">
      <div id="form-reset" class="hidden">
        <label>Nueva contraseña (mínimo 6 caracteres)</label>
        <div class="passwrap"><input id="r-pass" type="password" placeholder="••••••••" autocomplete="new-password"><button type="button" class="eye" data-for="r-pass">Ver</button></div>
        <label>Confirma tu contraseña nueva</label>
        <div class="passwrap"><input id="r-pass2" type="password" placeholder="••••••••" autocomplete="new-password"><button type="button" class="eye" data-for="r-pass2">Ver</button></div>
        <button class="btn" id="btn-save">Guardar contraseña nueva</button>
      </div>
      <div id="reset-done" class="hidden">
        <div class="okmsg" style="display:block">Tu contraseña se actualizó. Ya puedes entrar con tu contraseña nueva.</div>
        <a class="btn" href="cuenta.html">Ir a iniciar sesión</a>
      </div>
      <div class="err" id="err"></div>
    </div>
  </div>
</main>
<footer>© 2026 Nexo · Compra y vende seguro</footer>
<script>
var SUPABASE_URL = "https://ywtmzkzcxnntvxvjcger.supabase.co";
var SUPABASE_ANON = "sb_publishable_hm3dr-gmYE1loU-yXiZkow_uompYxYl";
function showErr(m){ var e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }
Array.prototype.forEach.call(document.querySelectorAll('.eye'), function(b){
  b.onclick = function(){
    var i = document.getElementById(b.getAttribute('data-for'));
    if(!i) return;
    var show = i.type === 'password';
    i.type = show ? 'text' : 'password';
    b.textContent = show ? 'Ocultar' : 'Ver';
  };
});
var params = new URLSearchParams(location.hash.replace(/^#/, ''));
var TOK = params.get('access_token');
var errDesc = params.get('error_description');
if(errDesc){
  showErr('Este enlace ya no es válido (' + errDesc.replace(/\+/g, ' ') + '). Pide otro desde "¿Olvidaste tu contraseña?" en la pantalla de entrada.');
} else if(TOK && params.get('type') === 'recovery'){
  document.getElementById('form-reset').classList.remove('hidden');
} else {
  showErr('Este enlace no es válido o ya venció. Pide otro desde "¿Olvidaste tu contraseña?" en la pantalla de entrada.');
}
var btnSave = document.getElementById('btn-save');
if(btnSave) btnSave.onclick = function(){
  document.getElementById('err').style.display = 'none';
  var p1 = document.getElementById('r-pass').value;
  var p2 = document.getElementById('r-pass2').value;
  if(p1.length < 6){ showErr('La contraseña debe tener mínimo 6 caracteres.'); return; }
  if(p1 !== p2){ showErr('Las contraseñas no coinciden. Escríbela dos veces igual.'); return; }
  btnSave.disabled = true; btnSave.textContent = 'Guardando…';
  fetch(SUPABASE_URL + '/auth/v1/user', {
    method: 'PUT',
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + TOK, 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: p1 })
  }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if(!res.ok){
        btnSave.disabled = false; btnSave.textContent = 'Guardar contraseña nueva';
        showErr((res.j && (res.j.msg || res.j.error_description)) || 'No se pudo guardar. El enlace pudo haber vencido: pide otro.');
        return;
      }
      try{ localStorage.removeItem('nexo_session'); localStorage.removeItem('nexo_tipo'); localStorage.removeItem('nexo_slug'); }catch(e){}
      document.getElementById('form-reset').classList.add('hidden');
      document.getElementById('reset-done').classList.remove('hidden');
    }).catch(function(){
      btnSave.disabled = false; btnSave.textContent = 'Guardar contraseña nueva';
      showErr('Error de conexión. Intenta de nuevo.');
    });
};
</script>
<script>function nxBack(){try{if(window.history.length>1){history.back();return;}}catch(e){}var a=document.querySelector('header.top .logo');window.location.href=a?a.getAttribute('href'):'index.html';}</script>
</body>
</html>
